name: Build Nifty APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          # Yahan humne stable version (0.26.0) lock kar diya hai
          python -m pip install "flet==0.26.0" requests

      - name: Build APK
        run: |
          yes y | flet build apk

      - name: Prepare Final APK
        run: |
          mkdir -p release
          APK=$(find build -type f -name "*.apk" | head -n 1)
          cp "$APK" release/NiftyPro.apk

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: NiftyPro-Mobile-App
          path: release/NiftyPro.apk
          if-no-files-found: error
          
