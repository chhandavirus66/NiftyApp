name: Build Nifty APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.28.3" requests

      - name: Verify Flet Version
        run: |
          python -c "import importlib.metadata; print('Flet Python:', importlib.metadata.version('flet'))"
          flet --version

      - name: Clean Previous Build
        run: |
          rm -rf build
          rm -rf release
          mkdir -p release

      - name: Build APK
        run: |
          yes y | flet build apk

      - name: Find APK
        run: |
          echo "Searching for generated APK..."
          find . -type f -name "*.apk" -print

      - name: Prepare Final APK
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Found APK: $APK"
          cp "$APK" release/NiftyPro.apk

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: NiftyPro-Mobile-App
          path: release/NiftyPro.apk
          if-no-files-found: error
